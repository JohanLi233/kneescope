[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kneescope"
version = "0.1.0"
description = "Measure the persistence boundary of Muon-style optimizer momentum and place the Newton-Schulz whitening knee."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "kneescope contributors" }]
keywords = [
    "muon",
    "optimizer",
    "newton-schulz",
    "spectral-response",
    "random-matrix-theory",
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
matplotlib = ["matplotlib>=3.7"]
mlx = ["mlx; sys_platform == 'darwin'"]
dev = ["pytest>=7.4", "matplotlib>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/kneescope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
